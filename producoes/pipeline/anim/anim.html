<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:"MX";src:url("../fonts/Montserrat-ExtraBold.ttf")}
  @font-face{font-family:"MM";src:url("../fonts/Montserrat-Medium.ttf")}
  @font-face{font-family:"MAO";src:url("../fonts/Caveat.ttf")}
  @font-face{font-family:"MAQ";src:url("../fonts/SpecialElite.ttf")}
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Cenas animadas do canal de mistérios (1920x1080). Cada cena é draw(t, dur, p), t em segundos.
// Tudo aqui é ilustração ou recriação: nenhuma imagem real das pessoas ou dos documentos do caso.
let W = 1920, H = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VERMELHO = '#e0262b', AMBAR = '#ffb347', LARANJA = '#ff7a1a', PAPEL = '#e6dcc3', TINTA = '#1d2a4a';

// ---------- utilidades ----------
function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return () => (s = s * 16807 % 2147483647) / 2147483647; }
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function fundo(c1 = '#05070c', c2 = '#000') {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function texto(str, x, y, size, cor = '#fff', fonte = 'MX', alinh = 'center', alpha = 1, esp = 0) {
  ctx.save(); ctx.globalAlpha = clamp(alpha, 0, 1); ctx.fillStyle = cor; ctx.textAlign = alinh; ctx.textBaseline = 'middle';
  ctx.font = `${size}px ${fonte}`; if (esp) ctx.letterSpacing = esp + 'px';
  const larg = ctx.measureText(str).width, max = W * 0.9; if (larg > max) { size = Math.floor(size * max / larg); ctx.font = `${size}px ${fonte}`; }
  ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 18; ctx.fillText(str, x, y); ctx.restore();
}
function vinheta(f = 0.75) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${f})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function fade(t, dur, d = 0.5) { return Math.min(ease(t / d), ease((dur - t) / d)); }
function grao(t, a = 0.06) { const r = rng(1 + Math.floor(t * 30));
  ctx.fillStyle = `rgba(255,255,255,${a})`; for (let i = 0; i < 700; i++) ctx.fillRect(r() * W, r() * H, 2, 2); }
function poeira(t, n = 60, cor = '255,220,180') { const r = rng(55);
  for (let i = 0; i < n; i++) { const x = (r() * W + t * (8 + r() * 14)) % W, y = (r() * H + Math.sin(t * 0.5 + i) * 20 + H) % H;
    ctx.fillStyle = `rgba(${cor},${0.08 + r() * 0.18})`; ctx.beginPath(); ctx.arc(x, y, r() * 2.2 + 0.5, 0, 6.283); ctx.fill(); } }
function chuva(t, forca = 1) { const r = rng(13); ctx.save(); ctx.strokeStyle = 'rgba(180,200,230,.28)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 380 * forca; i++) { const x0 = r() * (W + 300), v = 1300 + r() * 700, y = ((r() * H + t * v) % (H + 200)) - 100, x = x0 - (y + 100) * 0.18;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 7, y + 38); ctx.stroke(); } ctx.restore(); }
function estrelas(t, alpha = 0.6, ymax = H * 0.6) { const r = rng(42);
  for (let i = 0; i < 500; i++) { const x = r() * W, y = r() * ymax, rr = r() ** 3 * 1.8 + 0.3, f = r() * 6;
    ctx.globalAlpha = alpha * (0.5 + 0.5 * Math.sin(t * 1.5 + f)) * r(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1; }
function etiqueta_canto(str, a = 1) { texto(str, W - 60, H - 50, 26, 'rgba(255,255,255,.55)', 'MM', 'right', a, 4); }

// ---------- MORRO À NOITE ----------
// p: tarde (entardecer), luz (objeto laranja), corpos, pipa, chuva, cidade, zoom (aproximação), lanternas
function perfil(x, base, alt, seed) { const r = rng(seed); let y = 0;
  return x => base - alt * (0.55 + 0.45 * Math.sin(x / 520 + 1.2)) - 40 * Math.sin(x / 140 + seed) - 18 * Math.sin(x / 37 + seed * 2); }
const P1 = x => perfil(0, H * 0.78, 360, 3)(x), P2 = x => perfil(0, H * 0.86, 160, 7)(x);
const VERT = () => H > W;
// encolhe um bloco de largura fixa (papéis, mapas) para caber na tela, mantendo o centro
function caber(larg) { const k = Math.min(1, W * 0.94 / larg); ctx.translate(W / 2, H / 2 - (VERT() ? H * 0.1 : 0)); ctx.scale(k, k); ctx.translate(-W / 2, -H / 2); }
function morro(t, dur, p) {
  const z = 1 + (p.zoom ? ease(t / dur) * p.zoom : 0); ctx.save();
  ctx.translate(W / 2, H * 0.6); ctx.scale(z, z); ctx.translate(-W / 2 - t * (p.vel ?? 6), -H * 0.6);
  if (p.tarde) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1b2a4a'); g.addColorStop(0.55, '#a5583a'); g.addColorStop(0.75, '#e0a060'); g.addColorStop(1, '#2a1a14');
    ctx.fillStyle = g; ctx.fillRect(-400, -400, W + 1200, H + 800); }
  else { fundo('#0a1022', '#1a2133'); ctx.fillStyle = '#0a1022'; ctx.fillRect(-400, -400, W + 1200, 400); estrelas(t, p.chuva ? 0.15 : 0.6); }
  // lua encoberta
  if (!p.tarde) { const mx = W * 0.75; const lg = ctx.createRadialGradient(mx, 180, 10, mx, 180, 300); lg.addColorStop(0, 'rgba(210,220,255,.55)'); lg.addColorStop(0.1, 'rgba(180,195,240,.18)'); lg.addColorStop(1, 'rgba(120,140,200,0)');
    ctx.fillStyle = lg; ctx.fillRect(mx - 350, -150, 700, 650); }
  // cidade distante (luzes)
  if (p.cidade !== 0) { const r = rng(17); for (let i = 0; i < 260; i++) { const x = -300 + r() * (W + 900), y = H * 0.83 + r() * 60, a = 0.4 + 0.6 * Math.sin(t * 2 + i) ** 2;
      ctx.fillStyle = `rgba(255,${190 + r() * 50},${110 + r() * 60},${a * (p.tarde ? 0.4 : 0.85)})`; ctx.fillRect(x, y, 3, 3); } }
  // morro principal
  ctx.fillStyle = p.tarde ? '#160f0c' : '#04060b'; ctx.beginPath(); ctx.moveTo(-400, H + 400);
  for (let x = -400; x <= W + 800; x += 8) ctx.lineTo(x, P1(x)); ctx.lineTo(W + 800, H + 400); ctx.fill();
  // capim no topo
  const r = rng(29); ctx.strokeStyle = p.tarde ? '#2a1c14' : '#0b1018'; ctx.lineWidth = 2;
  for (let i = 0; i < 900; i++) { const x = -400 + r() * (W + 1200), y = P1(x) + 2, h = 10 + r() * 26, s = Math.sin(t * 1.3 + x / 90) * 5;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + s, y - h / 2, x + s * 1.6, y - h); ctx.stroke(); }
  // primeiro plano
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(-400, H + 400); for (let x = -400; x <= W + 800; x += 8) ctx.lineTo(x, P2(x) + 60); ctx.lineTo(W + 800, H + 400); ctx.fill();
  // corpos (silhuetas deitadas)
  if (p.corpos) { const cx = W / 2 + 20, cy = P1(cx) + 4; ctx.fillStyle = '#000';
    for (const dx of [-70, 70]) { ctx.beginPath(); ctx.ellipse(cx + dx, cy - 6, 16, 52, Math.PI / 2, 0, 6.283); ctx.fill(); ctx.beginPath(); ctx.arc(cx + dx - 62, cy - 10, 13, 0, 6.283); ctx.fill(); }
    if (p.brilho !== 0) { for (const dx of [-70, 70]) { const g = ctx.createRadialGradient(cx + dx - 62, cy - 12, 0, cx + dx - 62, cy - 12, 26); g.addColorStop(0, `rgba(200,210,230,${0.5 + 0.2 * Math.sin(t * 3)})`); g.addColorStop(1, 'rgba(200,210,230,0)'); ctx.fillStyle = g; ctx.fillRect(cx + dx - 92, cy - 42, 60, 60); } } }
  // lanternas da polícia
  if (p.lanternas) { ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 3; k++) { const ox = W * (0.16 + k * 0.135) + t * 20, oy = P1(W * (0.16 + k * 0.135)) + 30, ang = -0.25 + Math.sin(t * 0.8 + k * 2) * 0.3;
      const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, 900); g.addColorStop(0, 'rgba(255,240,200,.45)'); g.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.arc(ox, oy, 900, ang - 0.08, ang + 0.08); ctx.closePath(); ctx.fill(); } ctx.restore(); }
  // pipa
  if (p.pipa) { const px = W * 0.65 + Math.sin(t * 0.9) * 60, py = 260 + Math.sin(t * 1.4) * 30; ctx.save(); ctx.translate(px, py); ctx.rotate(Math.sin(t * 1.7) * 0.2);
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(28, 0); ctx.lineTo(0, 46); ctx.lineTo(-28, 0); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px, py + 46); ctx.quadraticCurveTo(px - 200, py + 300, W * 0.47, P1(W * 0.47)); ctx.stroke(); }
  // luz laranja
  if (p.luz) { const lx = W * 0.52 + Math.sin(t * 0.35) * 120, ly = (VERT() ? H * 0.3 : 260) + Math.sin(t * 0.9) * 110, pul = 0.85 + 0.15 * Math.sin(t * 6);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    let g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 520 * pul); g.addColorStop(0, 'rgba(255,150,50,.55)'); g.addColorStop(0.12, 'rgba(255,110,30,.25)'); g.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = g; ctx.fillRect(lx - 600, ly - 600, 1200, 1200);
    g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 46); g.addColorStop(0, '#fff6e0'); g.addColorStop(0.4, '#ffb050'); g.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly, 46, 0, 6.283); ctx.fill(); ctx.restore(); }
  ctx.restore();
  if (p.chuva) chuva(t, p.chuva);
  vinheta(0.85); grao(t, 0.05);
}

// ---------- MÁSCARAS DE CHUMBO (ilustração) ----------
function lente(x, y, s, rot, t, brilho) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  const forma = () => { ctx.beginPath();
    for (const lado of [-1, 1]) { ctx.moveTo(lado * 30, -6); ctx.bezierCurveTo(lado * 60, -62, lado * 190, -70, lado * 215, -18); ctx.bezierCurveTo(lado * 232, 30, lado * 180, 78, lado * 120, 76); ctx.bezierCurveTo(lado * 60, 74, lado * 28, 40, lado * 30, -6); }
    ctx.rect(-34, -14, 68, 22); };
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  const g = ctx.createLinearGradient(-220, -80, 220, 80); g.addColorStop(0, '#5d6268'); g.addColorStop(0.45, '#8d939a'); g.addColorStop(0.55, '#a7adb3'); g.addColorStop(1, '#43474c');
  ctx.fillStyle = g; forma(); ctx.fill(); ctx.shadowColor = 'transparent';
  // reflexo correndo
  ctx.save(); forma(); ctx.clip(); const k = ((t * 0.25 + brilho) % 1.6) - 0.3; const gl = ctx.createLinearGradient(-260 + k * 520, 0, -160 + k * 520, 0);
  gl.addColorStop(0, 'rgba(255,255,255,0)'); gl.addColorStop(0.5, 'rgba(255,255,255,.35)'); gl.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = gl; ctx.fillRect(-260, -100, 520, 200);
  // marcas de corte
  const r = rng(91); ctx.strokeStyle = 'rgba(30,30,30,.35)'; ctx.lineWidth = 1.5; for (let i = 0; i < 40; i++) { const a = r() * 400 - 200, b = r() * 140 - 60; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(a + r() * 30 - 15, b + r() * 8 - 4); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(20,20,20,.7)'; ctx.lineWidth = 3; forma(); ctx.stroke(); ctx.restore();
}
function mascara(t, dur, p) {
  fundo('#0b0d10', '#020203');
  const lg = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 900); lg.addColorStop(0, 'rgba(120,130,150,.25)'); lg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  const s = 1.25 + t * 0.03;
  if (p.duas && VERT()) { lente(W / 2, H / 2 - 300, s * 1.0, -0.08, t, 0); lente(W / 2, H / 2 + 300, s * 1.0, 0.06, t, 0.6); }
  else if (p.duas) { lente(W / 2 - 330, H / 2 + 10, s * 0.9, -0.12, t, 0); lente(W / 2 + 330, H / 2 - 10, s * 0.9, 0.09, t, 0.6); }
  else lente(W / 2, H / 2, s * 1.4, Math.sin(t * 0.3) * 0.05, t, 0);
  poeira(t, 50); vinheta(0.85); grao(t, 0.05);
}

// ---------- BILHETE MANUSCRITO (recriação) ----------
const BILHETE = ['16:30  estar no local determinado', '18:30  ingerir cápsulas', 'após efeito proteger metais', 'aguardar sinal', 'máscara'];
function papel(x, y, w, h, rot, linhas = true) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
  ctx.fillStyle = PAPEL; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.shadowColor = 'transparent';
  const g = ctx.createRadialGradient(0, 0, w * 0.2, 0, 0, w * 0.75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(90,60,20,.35)'); ctx.fillStyle = g; ctx.fillRect(-w / 2, -h / 2, w, h);
  if (linhas) { ctx.strokeStyle = 'rgba(70,110,170,.35)'; ctx.lineWidth = 2; for (let yy = -h / 2 + 110; yy < h / 2 - 30; yy += 74) { ctx.beginPath(); ctx.moveTo(-w / 2 + 20, yy); ctx.lineTo(w / 2 - 20, yy); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(200,60,60,.4)'; ctx.beginPath(); ctx.moveTo(-w / 2 + 110, -h / 2); ctx.lineTo(-w / 2 + 110, h / 2); ctx.stroke(); }
}
function bilhete(t, dur, p) {
  fundo('#140f0a', '#050302'); poeira(t, 30);
  const s = 1 + t * 0.012 + (p.foco !== undefined ? 0.15 : 0); ctx.save(); caber(1300); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
  papel(W / 2, H / 2, 1240, 780, -0.025);
  const total = p.ate ?? BILHETE.length, vel = p.rapido ? 0.5 : (dur * 0.85) / total;
  BILHETE.forEach((l, i) => { if (i >= total) return; const k0 = p.todos ? 0 : i * vel, n = Math.floor(clamp((t - k0) / (vel * 0.8), 0, 1) * l.length);
    const foco = p.foco === undefined || p.foco === i;
    ctx.font = '88px MAO'; ctx.fillStyle = foco ? TINTA : 'rgba(29,42,74,.35)'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const y = -390 + 140 + i * 74 + 30; ctx.fillText(l.slice(0, n), -620 + 140, y);
    if (p.foco === i && t > 0.6) { const w = ctx.measureText(l).width * ease((t - 0.6) / 0.6); ctx.strokeStyle = VERMELHO; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-480, y + 14); ctx.lineTo(-480 + w, y + 18); ctx.stroke(); } });
  ctx.restore(); ctx.restore();
  vinheta(0.8); grao(t, 0.05);
}

// ---------- CADERNO DE ANOTAÇÕES TÉCNICAS (recriação) ----------
function caderno(t, dur, p) {
  fundo('#120e0a', '#040302');
  ctx.save(); caber(1150); ctx.translate(W / 2, H / 2 - t * 18); papel(0, 0, 1100, 1500, 0.03);
  const r = rng(61), cod = ['6V6', '12AX7', 'EL84', '6BQ5', '35W4', '50C5', '12BA6', '1N34', 'OC71', 'ECC83', '220 Ω', '47 kΩ', '0,1 µF', '100 µF', '6,3 V', '250 V'];
  ctx.font = '60px MAO'; ctx.fillStyle = TINTA; ctx.textAlign = 'left';
  for (let i = 0; i < 18; i++) { let l = ''; for (let k = 0; k < 4; k++) l += cod[Math.floor(r() * cod.length)] + (r() < 0.5 ? ' — ' : '  '); ctx.globalAlpha = 0.85; ctx.fillText(l, -400, -640 + i * 74); }
  ctx.restore(); ctx.restore(); ctx.globalAlpha = 1;
  vinheta(0.85); grao(t, 0.05);
}

// ---------- MAPA ----------
function mapa(t, dur, p) {
  if (VERT()) { const w0 = W, h0 = H, k = W / 1920; ctx.fillStyle = '#020306'; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.translate(0, (H - 1080 * k) / 2); ctx.scale(k, k);
    W = 1920; H = 1080; try { mapa_h(t, dur, p); } finally { W = w0; H = h0; ctx.restore(); } return; }
  mapa_h(t, dur, p);
}
function mapa_h(t, dur, p) {
  fundo('#070a10', '#020306');
  ctx.strokeStyle = 'rgba(120,150,200,.08)'; ctx.lineWidth = 1; for (let x = 0; x < W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 0; y < H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // litoral estilizado do estado do Rio
  ctx.strokeStyle = 'rgba(160,190,230,.55)'; ctx.lineWidth = 4; ctx.beginPath();
  const costa = [[0, 760], [260, 800], [520, 760], [700, 790], [880, 720], [1000, 735], [1120, 690], [1300, 640], [1440, 560], [1560, 470], [1650, 380], [1720, 300], [1800, 200], [1920, 150]];
  costa.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  ctx.fillStyle = 'rgba(40,70,120,.18)'; ctx.lineTo(1920, 1080); ctx.lineTo(0, 1080); ctx.fill();
  texto('OCEANO ATLÂNTICO', 1280, 900, 30, 'rgba(160,190,230,.45)', 'MM', 'center', 1, 10);
  const pts = { campos: [1640, 330], niteroi: [940, 700], sp: [140, 640] };
  const ponto = (k, nome, cor, a) => { const [x, y] = pts[k]; ctx.globalAlpha = a; ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(x, y, 12, 0, 6.283); ctx.fill();
    ctx.strokeStyle = cor; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 12 + (t * 30) % 40, 0, 6.283); ctx.globalAlpha = a * (1 - ((t * 30) % 40) / 40); ctx.stroke(); ctx.globalAlpha = 1;
    texto(nome, x + (x > 1400 ? -40 : 0), y - 50, 40, '#fff', 'MX', x > 1400 ? 'right' : 'center', a, 3); };
  const a = fade(t, dur, 0.4);
  ponto('campos', 'CAMPOS DOS GOYTACAZES', AMBAR, a);
  if (p.sp) { const k = ease(t / (dur * 0.5)); ctx.setLineDash([14, 14]); ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(...pts.campos);
    ctx.lineTo(pts.campos[0] + (pts.sp[0] - pts.campos[0]) * k, pts.campos[1] + (pts.sp[1] - pts.campos[1]) * k); ctx.stroke(); ctx.setLineDash([]);
    ponto('sp', 'SÃO PAULO', '#9fb6d8', a * ease(t / (dur * 0.5)));
    if (p.x && t > dur * 0.55) { const [x, y] = pts.sp, q = ease((t - dur * 0.55) / 0.4); ctx.strokeStyle = VERMELHO; ctx.lineWidth = 12; ctx.globalAlpha = q;
      ctx.beginPath(); ctx.moveTo(x - 50, y - 50); ctx.lineTo(x + 50, y + 50); ctx.moveTo(x + 50, y - 50); ctx.lineTo(x - 50, y + 50); ctx.stroke(); ctx.globalAlpha = 1; } }
  if (p.niteroi) { const k0 = p.sp ? dur * 0.5 : 0, k = ease((t - k0) / (dur * 0.4)); ctx.strokeStyle = VERMELHO; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(...pts.campos);
    ctx.lineTo(pts.campos[0] + (pts.niteroi[0] - pts.campos[0]) * k, pts.campos[1] + (pts.niteroi[1] - pts.campos[1]) * k); ctx.stroke();
    if (k > 0) ponto('niteroi', 'NITERÓI', VERMELHO, a * k); }
  if (p.legenda) texto(p.legenda, W / 2, 110, 46, AMBAR, 'MX', 'center', a, 8);
  vinheta(0.7); grao(t, 0.04);
}

// ---------- RELÓGIO ----------
function relogio(t, dur, p) {
  fundo('#0b0b0f', '#020203'); const cx = W / 2, cy = H / 2 - 30, R = 330;
  const [h0, m0] = (p.de || '14:30').split(':').map(Number), [h1, m1] = (p.ate || p.de || '14:30').split(':').map(Number);
  const min = (h0 * 60 + m0) + ((h1 * 60 + m1) - (h0 * 60 + m0)) * ease(t / (dur * 0.85));
  ctx.fillStyle = '#d9d2bf'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.fill(); ctx.strokeStyle = '#3a3226'; ctx.lineWidth = 22; ctx.stroke();

// ---------- praia à noite (Ubatuba) ----------

// ---------- criatura agachada perto do muro (ilustração, Varginha) ----------
function criatura(t, dur, p) {

// ---------- fotos espalhadas na mesa (recriação de registros com luzes) ----------
function fotos(t, dur, p) {
  fundo('#120d08', '#030201'); const r = rng(p.seed ?? 23), n = p.n ?? 5, s = Math.min(W / 1920, H / 1080) * 1.0 * (VERT() ? 1.6 : 1);
